 else if(P.size==2){const[a,b]=[...P.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(last)zoom(d/last,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);last=d;moved=true}};
